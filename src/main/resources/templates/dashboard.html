<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SecureBank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">SecureBank</div>
        <div class="navbar-menu">
            <a href="/dashboard" class="navbar-item">Dashboard</a>
            <a href="/accounts" class="navbar-item">Accounts</a>
            <span class="navbar-item">Welcome, <span th:text="${user.fullName}"></span></span>
            <a href="/logout" class="navbar-item">Logout</a>
        </div>
    </div>

    <div class="container">
        <h1>Dashboard</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Quick Actions</h3>
                <ul class="action-list">
                    <li><a href="/accounts">View All Accounts</a></li>
                    <li><a href="/accounts/create">Create New Account</a></li>
                </ul>
            </div>

            <div class="dashboard-card">
                <h3>Account Information</h3>
                <p><strong>Name:</strong> <span th:text="${user.fullName}"></span></p>
                <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                <p><strong>Phone:</strong> <span th:text="${user.phoneNumber}"></span></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 SecureBank. All rights reserved.</p>
    </footer>
</body>
</html>
